<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>SHSAT Practice Tests</title><style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#14213d;--mute:#5b6678;--line:#d5dbe6;--navy:#1d3a6e;--onnavy:#fff;--sel:#e3ecff;--ok:#1f7a4d;--bad:#b3261e;--flag:#c77700;--green:#1f7a4d;--font:"Trebuchet MS","Segoe UI",Verdana,sans-serif;--serif:Georgia,"Times New Roman",serif}

.ib:disabled{opacity:.35}
.timer{font-variant-numeric:tabular-nums;font-weight:700;min-width:48px;text-align:right}
.tabs{display:flex;gap:6px;padding:10px 14px 0;max-width:980px;margin:0 auto}
.tab{flex:1;padding:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:inherit;font-size:14px}
.tab.on{background:var(--navy);color:var(--onnavy);border-color:var(--navy)}
main{max-width:980px;margin:0 auto;padding:12px 14px 100px}
.split{display:grid;gap:12px}
@media(min-width:820px){.split.two{grid-template-columns:1fr 1fr}}

.pp{display:flex;gap:10px;margin:0 0 10px}.pp>b{font-family:var(--font);font-size:12px;color:var(--mute);min-width:1.4em;padding-top:5px}.pp>div{flex:1}
.sn{cursor:pointer;border-radius:4px}.sn:hover{background:var(--sel)}.sn.on{background:#ffe08a;color:#14213d}.sn small{font-family:var(--font);font-size:11px;color:var(--mute);font-weight:700}
.pl{display:flex;gap:12px;line-height:1.5}.pl i{font-style:normal;width:1.6em;text-align:right;font-family:var(--font);font-size:12px;color:var(--mute);padding-top:4px}.pl span{flex:1}.stz{height:10px}
table.tb{border-collapse:collapse;width:100%;font-family:var(--font);font-size:14px;margin:6px 0}
table.tb th,table.tb td{border:1px solid var(--line);padding:6px 8px;text-align:center}table.tb th{background:var(--bg)}
.cap{font-family:var(--font);font-size:13px;font-weight:700;margin-top:8px}
.opt{display:block;margin:0}

.x{width:40px;border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:8px;font:inherit}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;z-index:4}

.gb:disabled{opacity:.35}
.exp{margin-top:12px;padding:10px 12px;border-left:4px solid var(--navy);background:var(--bg);border-radius:4px;font-size:15px}
h1{font-size:26px;margin:6px 0}h2{font-size:19px;margin:16px 0 6px}
.big{font-size:44px;font-weight:700;color:var(--navy)}
ul{padding-left:20px}
.item{border-top:1px solid var(--line);padding:14px 0}
.tag{font-weight:700}.ok{color:var(--ok)}.bad{color:var(--bad)}
.lv{display:block;width:100%;text-align:left;margin:10px 0;padding:14px}.lv small{font-weight:400;opacity:.85}
select.dd{font:inherit;font-size:16px;padding:4px 6px;border:1.5px solid var(--navy);border-radius:6px;background:var(--card);color:var(--ink);max-width:100%}
.eq{display:flex;align-items:center;gap:8px;border:2px solid var(--navy);border-radius:8px;padding:8px 12px;min-height:54px;font-size:24px;background:var(--card);margin:6px 0 10px;max-width:340px}
.eq .pre{color:var(--mute)}.eq .cur{display:inline-block;width:2px;height:26px;background:var(--navy);animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;font-size:20px;line-height:1.1}.fr span:first-child{border-bottom:2px solid var(--ink);padding:0 4px;min-width:1ch;text-align:center}.fr span:last-child{padding:0 4px;min-width:1ch;text-align:center}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:340px}
.kp button{padding:12px 0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:inherit;font-size:19px}
.kp button.o{background:var(--bg);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1.5px solid var(--navy);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 14px;font:inherit}
.chip.on{background:#ffe08a;color:#14213d}
.slot{display:inline-block;min-width:120px;min-height:38px;border:2px dashed var(--navy);border-radius:8px;padding:6px 10px;vertical-align:middle;background:var(--card);color:var(--ink);font:inherit;text-align:center}
.slot.fill{border-style:solid;background:var(--sel)}
.srow{display:flex;gap:10px;align-items:center;margin:8px 0}.srow>div:first-child{flex:1}
.nl{width:100%;max-width:420px;touch-action:manipulation}
.tools{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}
.tl{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 10px;font:inherit;font-size:13px}
textarea.np{width:100%;min-height:90px;font:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:8px;padding:8px;background:var(--card);color:var(--ink);margin-bottom:10px}
.ib.pri{background:#2563eb;border-color:#2563eb}
mark.hl{background:#ffe08a;color:#14213d;border-radius:2px}
.box{border:1.5px solid var(--ink);border-radius:4px;padding:10px 12px;margin:8px 0;font-family:var(--serif);font-size:16px;line-height:1.6}
.bigbox{border:2px dashed var(--navy);border-radius:10px;padding:10px;min-height:90px;text-align:center;margin:12px 0;background:var(--bg)}.bigbox .bt{font-weight:700;color:var(--mute);margin-bottom:8px}
.chip.big{padding:14px 18px;min-width:96px;border-radius:10px;font-weight:700}
.el{font-size:20px;line-height:2.3;font-family:var(--serif)}
.rep{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 14px}.rep th,.rep td{border:1px solid var(--line);padding:6px 8px;text-align:left}.rep .gh{background:#3a4f63;color:#fff;text-align:center;font-size:15px}.rep .ch{background:#4b6580;color:#fff}
.intro{text-align:center;padding:40px 10px}.intro h1{font-size:28px}.pill{display:inline-block;background:#dceaf7;color:#25506f;border:1px solid #b6d6ec;border-radius:4px;padding:16px 36px;font-size:22px;margin:14px 0 26px}
.endc{text-align:center;padding:30px 10px}
.tl.on{background:#fde8c8;border-color:#d98a1e;font-weight:600}</style></head><body><div id="app"></div><script>
function PP(a){return a.map(function(t,i){return '<div class="pp"><b>'+(i+1)+'</b><div>'+t+'</div></div>'}).join('')}
function POEM(st){var n=0;return st.map(function(s){return s.map(function(l){n++;return '<div class="pl"><i>'+(n%5==0?n:'')+'</i><span>'+l+'</span></div>'}).join('')}).join('<div class="stz"></div>')}
function SENTS(paras){var n=0;return paras.map(function(p){return '<p>'+p.map(function(s){n++;return '<span class="sn" id="sn'+n+'" onclick="snp('+n+')"><small>['+n+']</small> '+s+'</span>'}).join(' ')+'</p>'}).join('')}
var SETS={};

var L_SVG='<svg viewBox="0 0 230 150" width="230" style="max-width:100%" role="img" aria-label="L-shaped figure 14 wide and 9 tall with a 6 by 4 notch cut from the top right corner"><polygon points="20,15 116,15 116,63 188,63 188,123 20,123" fill="#9db8ea" stroke="#1d3a6e" stroke-width="2"/><g font-size="13" style="fill:var(--ink)"><text x="104" y="140" text-anchor="middle">14</text><text x="8" y="73">9</text><text x="152" y="57" text-anchor="middle">6</text><text x="122" y="42">4</text></g></svg>';
SETS.C1={title:'The Floating Gardens',dir:'Read the passage and answer the questions. Use the highlighter or notepad as needed.',html:PP([
'When Spanish explorers first saw the Aztec capital of Tenochtitlan in 1519, they marveled at a city built on a lake. Less noticed was the farmland that fed it. Around the city’s edges, thousands of narrow, rectangular plots called chinampas stretched across the shallow water, each one green with crops.',
'Building a chinampa was patient work. Farmers drove willow stakes into the lake bed to mark out a plot, wove reeds between the stakes to form walls, and then filled the enclosure with layers of mud from the lake bottom and rotting plants. Over time the pile rose above the surface, becoming an island of rich soil. Willow trees planted along the edges anchored the structure with their roots.',
'The design solved a problem that defeats many farmers: water. Because chinampas sat in the lake, their soil stayed damp without rain, and canals between the plots let farmers deliver fresh mud and water by canoe. Crops could be planted and harvested several times a year, a pace few farms could match.',
'Today, only a portion of the chinampas around the Xochimilco district of Mexico City survive. Growing neighborhoods have drained canals and filled in plots, and polluted water has damaged what remains. Yet some farmers still grow vegetables and flowers there using methods their families have practiced for generations, and the area is recognized as a World Heritage Site.',
'Researchers now study chinampas as a model of sustainable farming. The plots use few outside resources, and the farmers rely on the lake itself for fertile soil. If cities can protect these floating fields, the farmers of Xochimilco may offer lessons for growing food in a warming, crowded world.'])};
var T1E=[
{s:'ela',k:'Central idea & summary',t:'Multiple choice',ty:'mc',set:'C1',q:'Which statement best expresses the central idea of the passage?',o:['The Aztecs built their capital city on a lake, and Spanish explorers admired it.','Chinampas were a clever method of farming that is now threatened but may still teach useful lessons.','Willow trees are the most important part of building a farm on water.','Modern farmers have replaced chinampas with machinery and chemical fertilizer.'],a:1,e:'The passage describes how chinampas worked (paragraphs 2–3), what threatens them now (4), and what they might offer the future (5). The correct choice covers all of it. The others focus only on the opening, only on one detail, or on something the passage does not say.'},
{s:'ela',k:'Words & figurative language',t:'Word choice',ty:'mc',set:'C1',q:'In paragraph 3, the author writes that water is “a problem that defeats many farmers.” What is the effect of the word “defeats”?',o:['It suggests that farmers who struggle with water are not skilled.','It emphasizes how serious and hard to overcome the water problem usually is.','It shows that chinampas were created during a war.','It implies that the Aztec farmers never had difficulty with water.'],a:1,e:'“Defeats” is a strong, battle-like word. It stresses that water shortage is a serious obstacle that beats most farmers, which makes the chinampa solution more impressive.'},
{s:'ela',k:'Evidence',t:'Select two',ty:'ms',n:2,set:'C1',q:'Select the <b>two</b> details that best support the idea that chinampas solved the problem of water.',o:['“Willow trees planted along the edges anchored the structure with their roots.”','“Because chinampas sat in the lake, their soil stayed damp without rain.”','“…canals between the plots let farmers deliver fresh mud and water by canoe.”','“Growing neighborhoods have drained canals and filled in plots…”','“Researchers now study chinampas as a model of sustainable farming.”'],a:[1,2],e:'B and C both show how the lake and canals supplied water. A is about holding the structure together, D is about a modern threat, and E is about research today.'},
{s:'ela',k:'Structure',t:'Multiple choice',ty:'mc',set:'C1',q:'How does paragraph 4 contribute to the development of the passage?',o:['It shifts from how chinampas were built to the present, showing that they are threatened but not gone.','It repeats the description of the farmers’ methods from paragraph 2.','It introduces a new type of farming that replaced chinampas.','It argues that the Aztec capital should be rebuilt.'],a:0,e:'Paragraphs 1–3 describe the past. Paragraph 4 begins “Today,” and moves to the present situation, which sets up the hope expressed in paragraph 5.'},
{s:'ela',k:'Central idea & summary',t:'Inference',ty:'mc',set:'C1',q:'Which inference is best supported by paragraphs 4 and 5?',o:['Chinampas will soon return to every city in the world.','Protecting chinampas could benefit more than the farmers who use them.','Farmers in Xochimilco would be happier using modern machinery.','Pollution is a problem only in Mexico City.'],a:1,e:'Paragraph 5 says researchers see chinampas as a model and that they may offer “lessons” for growing food elsewhere. So protecting them could help people beyond Xochimilco. The other choices go beyond the text.'},
{s:'ela',k:'Revising & editing',t:'Fix a modifier',ty:'mc',q:'Which revision corrects the error?<br><br><i>Walking along the shore, a message in a bottle caught Imani’s eye.</i>',o:['Walking along the shore, Imani noticed a message in a bottle.','Walking along the shore, a message in a bottle was noticed.','Imani’s eye was caught, walking along the shore, by a message in a bottle.','Walking along the shore, in a bottle a message caught Imani’s eye.'],a:0,e:'“Walking along the shore” must describe a person, and a message cannot walk. Make Imani the subject so the opening phrase describes her.'},
{s:'ela',k:'Revising & editing',t:'Move to box',ty:'dnd',box:1,q:'Which sentence in the paragraph contains an error in construction?<div class="box">(1) The octopus, a mollusk with eight arms and no bones, can squeeze through any opening larger than its beak. (2) Because it has no skeleton, it can hide in tiny crevices and then reappear suddenly. (3) Scientists have observed octopuses unscrewing jar lids, solving mazes, and they escape from sealed tanks. (4) Such behavior suggests a surprising level of intelligence.</div>Move the answer to the box. There is only one error in construction.',items:['Sentence 1','Sentence 2','Sentence 3','Sentence 4'],sl:['Contains an error in construction'],a:[2],e:'The list in sentence 3 starts with “-ing” forms (unscrewing, solving) and then switches to “they escape.” It should stay parallel: “unscrewing jar lids, solving mazes, and escaping from sealed tanks.”'}];
var T1M=[
{s:'math',k:'Ratios & rates',t:'Typed answer',ty:'g',hint:'Enter only your answer.',q:'A punch recipe uses 3 cups of orange juice for every 2 cups of ginger ale. Leila has 6 quarts of orange juice and wants to use all of it. How many <b>cups</b> of ginger ale does she need? (1 quart = 4 cups)',a:'16',e:'6 quarts = 6 × 4 = 24 cups of juice. The juice-to-ginger-ale ratio is 3 : 2, and 24 is 8 groups of 3, so the ginger ale is 8 × 2 = 16 cups.'},
{s:'math',k:'Expressions & equations',t:'Move to box',ty:'dnd',q:'Complete the steps to solve the equation <b>(2/3)(x − 9) = 10</b> for <i>x</i>.<br><br>Move the correct answer to each box. Not all answers will be used.',tpl:'<div class="el">(2/3)(x − 9) = 10</div><div class="el">x − 9 = {0}</div><div class="el">x = {1}</div>',items:['−15','6','15','19','24','33'],sl:['Box 1','Box 2'],a:[2,4],e:'Multiply both sides by 3/2 to undo the 2/3: x − 9 = 10 × 3/2 = 15. Then add 9: x = 24.'},
{s:'math',k:'Expressions & equations',t:'Select two',ty:'ms',n:2,q:'Which <b>two</b> expressions are equivalent to 2(3x − 5) − (x − 4)?',o:['5x − 14','5x − 6','7x − 14','5x − 10 + 4','6x − 6','4x − 6'],a:[1,3],e:'Distribute: 2(3x − 5) = 6x − 10, and −(x − 4) = −x + 4. Combine: 5x − 6 (choice B). Choice D, 5x − 10 + 4, is the same value. A common slip is forgetting that the minus sign changes the −4 into +4.'},
{s:'math',k:'Inequalities',t:'Graph an inequality',ty:'ineq',q:'Graph the solution to the inequality below on the number line.<br><b style="font-size:20px">4 − 3x ≥ 10</b>',a:{x:-2,c:'c',d:'L'},e:'Subtract 4: −3x ≥ 6. Divide by −3 and <b>flip the sign</b>: x ≤ −2. The endpoint is included (≥ became ≤), so use a closed circle at −2 and shade to the left.'},
{s:'math',k:'Ratios & rates',t:'Drop-down',ty:'dd',q:'Three stores sell notebooks. Store A sells 6 notebooks for $9.00. Store B sells 10 notebooks for $14.50. Store C sells 4 notebooks for $5.40.',tpl:'Store A charges {0} per notebook. The lowest price per notebook is at {1}. Store B charges {2} more per notebook than Store C.',dd:[['$1.35','$1.50','$1.60'],['Store A','Store B','Store C'],['$0.05','$0.10','$0.15']],a:[1,2,1],e:'Unit prices: A = 9 ÷ 6 = $1.50, B = 14.50 ÷ 10 = $1.45, C = 5.40 ÷ 4 = $1.35. Store C is lowest. B − C = 1.45 − 1.35 = $0.10.'},
{s:'math',k:'Statistics',t:'Typed answer',ty:'g',hint:'Enter only your answer.',q:'The mean of 5 numbers is 18. When one of the numbers is removed, the mean of the remaining 4 numbers is 16. What number was removed?',a:'26',e:'The total of the 5 numbers is 5 × 18 = 90. The total of the remaining 4 is 4 × 16 = 64. The removed number is 90 − 64 = 26.'},
{s:'math',k:'Geometry',t:'Composite area',ty:'mc',q:'The figure below is a rectangle that is 14 units wide and 9 units tall with a 6-by-4 rectangular notch removed from one corner. What is its area?<div style="margin:8px 0;text-align:center">'+L_SVG+'</div>',o:['90 square units','102 square units','110 square units','126 square units'],a:1,e:'Whole rectangle: 14 × 9 = 126. Notch: 6 × 4 = 24. Area = 126 − 24 = 102. (126 forgets the notch.)'}];
SETS.C2={title:'The Night Market',dir:'Read the passage and answer the questions. Use the highlighter or notepad as needed.',html:PP([
'Every Saturday, Marisol helped her grandfather set up his stall at the night market, unrolling the canvas awning while he arranged jars of pickled mango in careful pyramids. She had always loved the lanterns, the sizzle of grills, the crowd moving like a slow river. Tonight, though, she kept her eyes on her sneakers.',
'“You are quiet,” Abuelo said, not looking up. He turned a jar a quarter inch until its label faced the aisle.',
'“I have the science fair on Monday,” she admitted. “Everyone’s project is so impressive. Dev built a working robot arm. Mine is just a poster about how pickling works.”',
'Abuelo chuckled and held up a jar, tilting it so the lantern light glowed through the amber brine. “Forty years I have sold the same pickles,” he said. “People think there is nothing to say about them. Then a customer asks how, and I tell them about salt drawing water out of the fruit, about the tiny living things that make the sour. They stay an hour.” He set the jar back. “A simple thing is only simple until someone explains it well.”',
'A woman stopped at the stall, and Marisol, almost without deciding to, stepped forward. “These are fermented,” she heard herself say. “That means the mango is actually changing while it sits in the jar.” By the time the woman left with two jars, Marisol’s shoulders had loosened, and she noticed the lanterns again.'])};
var T2E=[
{s:'ela',k:'Central idea & summary',t:'Theme',ty:'mc',set:'C2',q:'Which statement best expresses a theme of the passage?',o:['Winning a competition matters more than the project itself.','Something ordinary can become interesting when it is explained with knowledge and confidence.','Older people always give better advice than people the same age.','Nervous feelings fade fastest when a person avoids the thing that worries them.'],a:1,e:'Abuelo says “A simple thing is only simple until someone explains it well,” and Marisol proves it by explaining fermentation. The other choices are not supported by the events.'},
{s:'ela',k:'Evidence',t:'Inference',ty:'mc',set:'C2',q:'What does the detail “she kept her eyes on her sneakers” in paragraph 1 suggest about Marisol?',o:['She is bored by the market.','She is worried and does not want to be noticed.','She is angry at her grandfather.','She is looking for something she dropped.'],a:1,e:'Looking down at her shoes, in contrast to how much she “had always loved” the lanterns and crowd, shows she is anxious. Her explanation about the science fair confirms it.'},
{s:'ela',k:'Evidence',t:'Select two',ty:'ms',n:2,set:'C2',q:'Select the <b>two</b> details that show Abuelo pays close attention to small details.',o:['“…arranged jars of pickled mango in careful pyramids.”','“He turned a jar a quarter inch until its label faced the aisle.”','“Abuelo chuckled and held up a jar…”','“Forty years I have sold the same pickles…”','“A woman stopped at the stall…”'],a:[0,1],e:'Building careful pyramids and adjusting a jar by a quarter inch both show close attention to detail. Choice D shows experience, not attention to small details.'},
{s:'ela',k:'Structure',t:'Multiple choice',ty:'mc',set:'C2',q:'How does paragraph 4 contribute to the development of the passage?',o:['It introduces a conflict between Marisol and her grandfather.','It gives Marisol a new way to see her project, which leads to her action in paragraph 5.','It describes the market in more detail than earlier paragraphs.','It shows that Abuelo does not understand Marisol’s worry.'],a:1,e:'Abuelo’s speech changes how Marisol thinks about a “simple” subject. In paragraph 5 she acts on that idea by explaining fermentation to the customer.'},
{s:'ela',k:'Words & figurative language',t:'Drop-down',ty:'dd',set:'C2',q:'Complete the sentences about how Marisol changes.',tpl:'Marisol’s change in confidence is caused by {0}. This change is shown most clearly when {1}.',dd:[['the success of Dev’s robot arm','her grandfather’s explanation of why simple things can fascinate people','the woman’s decision to buy two jars'],['she keeps her eyes on her sneakers','she admits her worry about the science fair','she explains fermentation to a customer']],a:[1,2],e:'Abuelo’s words about explaining simple things well come before Marisol’s action, so they are the cause. The clearest sign of her new confidence is stepping forward and explaining fermentation without planning to.'},
{s:'ela',k:'Revising & editing',t:'Pronoun clarity',ty:'mc',q:'Read the sentence.<div class="box">When Dana handed her sister the camera, she noticed that the lens was cracked.</div>The writer intends to say that <b>Dana</b> noticed the crack. Which revision makes this clear without introducing an error?',o:['When Dana handed her sister the camera, Dana noticed that the lens was cracked.','When Dana handed her sister the camera, it was noticed that the lens was cracked.','Dana handed her sister the camera, she noticed that the lens was cracked.','When Dana handed her sister the camera, she noticed that it was cracked.'],a:0,e:'In the original, “she” could mean Dana or her sister. Repeating the name removes the confusion. The version that hides who noticed, the comma splice, and the version that keeps the unclear “she” and adds an unclear “it” are all weaker.'},
{s:'ela',k:'Revising & editing',t:'Punctuation',ty:'mc',q:'Which sentence is punctuated correctly?',o:['Mr. Ortiz who coaches our team, ordered new jerseys.','Mr. Ortiz, who coaches our team, ordered new jerseys.','Mr. Ortiz, who coaches our team ordered new jerseys.','Mr. Ortiz who coaches, our team ordered new jerseys.'],a:1,e:'“Who coaches our team” is extra information about a named person, so it is set off by a pair of commas, one before and one after.'}];

{s:'math',k:'Expressions & equations',t:'Move to box',ty:'dnd',q:'Complete the steps to solve <b>3(x + 2) = 5x − 4</b> for <i>x</i>.<br><br>Move the correct answer to each box. Not all answers will be used.',tpl:'<div class="el">3x + 6 = 5x − 4</div><div class="el">{0} = 2x</div><div class="el">x = {1}</div>',items:['−10','2','5','6','10','14'],sl:['Box 1','Box 2'],a:[4,2],e:'Distribute: 3x + 6 = 5x − 4. Add 4 and subtract 3x on both sides: 10 = 2x. Divide by 2: x = 5.'},

{s:'math',k:'Counting & probability',t:'Typed answer',ty:'g',hint:'Enter only your answer.',q:'A fair spinner has 8 equal sections numbered 1 through 8. It is spun twice. What is the probability that both spins land on even numbers?',a:'1/4',e:'The probability of an even number on one spin is 4/8 = 1/2. The spins are independent, so 1/2 × 1/2 = 1/4.'},
{s:'math',k:'Geometry',t:'Multiple choice',ty:'mc',q:'A circular garden has a circumference of 18π meters. A path 2 meters wide surrounds the garden. What is the area of the path, in square meters?',o:['22π','36π','40π','81π'],a:2,e:'Circumference 18π means diameter 18, so the garden’s radius is 9. With the path the radius is 11. Path area = π(11²) − π(9²) = 121π − 81π = 40π.'}];
SETS.C3={title:'The Library Is Not Quiet Anymore',dir:'Read the passage and answer the questions. Use the highlighter or notepad as needed.',html:PP([
'Walk into the main branch of many city libraries today and you may be startled. Where hushed reading rooms once stood, there may be a workshop with 3D printers, a recording booth, or a room full of children coding games. Some people see this change as a betrayal of what libraries are meant to be. They are mistaken.',
'Critics argue that libraries exist for books, and that every dollar spent on a sewing machine is a dollar taken from the shelves. But this view misunderstands what the first public libraries set out to do. When Benjamin Franklin and his friends pooled their money in 1731 to share books, the purpose was not the books themselves. It was to give ordinary people access to knowledge they could not afford alone.',
'Today, knowledge comes in more forms. A teenager who has never touched a power tool may learn more from an afternoon in a library workshop than from a chapter about it. A job seeker without a home computer can write a résumé at a library terminal. In each case the library is doing exactly what Franklin intended: opening a door that would otherwise stay closed.',
'Of course, the critics raise a fair point about budgets. Libraries must spend carefully, and no new service should crowd out the collection that makes a library a library. The solution, however, is not to freeze libraries in the past. It is to measure each program by one simple question: does it help people learn?',
'By that measure, the noisy library is succeeding. Many branches report that visits are rising even as bookstores close. A library that sounds busy, it turns out, is one the community has decided to keep.'])};

{s:'ela',k:'Structure',t:'Purpose of a paragraph',ty:'mc',set:'C3',q:'What is the main purpose of paragraph 2?',o:['To explain the history of Benjamin Franklin’s career','To answer the critics by pointing to the original purpose of public libraries','To list the programs that modern libraries offer','To argue that libraries should return to the way they were in 1731'],a:1,e:'Paragraph 2 states the critics’ view and then argues that the first libraries were about giving people access to knowledge, not about books for their own sake. That supports the author’s side.'},
{s:'ela',k:'Evidence',t:'Select two',ty:'ms',n:2,set:'C3',q:'Select the <b>two</b> details the author uses to show how modern libraries give people access to knowledge they could not easily reach otherwise.',o:['Libraries once had hushed reading rooms.','A teenager can learn about tools in a library workshop.','A job seeker without a home computer can write a résumé at the library.','Libraries must spend their money carefully.','Bookstores are closing in many places.'],a:[1,2],e:'Paragraph 3 gives these two examples of people gaining access to learning or tools they lack. The other details describe the past, a budget concern, or bookstores.'},
{s:'ela',k:'Structure',t:'Multiple choice',ty:'mc',set:'C3',q:'How does the author use paragraph 4 to strengthen the argument?',o:['By admitting that critics have a fair concern and then showing how to address it','By ignoring the critics so the argument stays simple','By changing the topic from libraries to bookstores','By repeating the opening paragraph in different words'],a:0,e:'The author concedes a fair point about budgets and then offers a standard (does it help people learn?) that answers it. Acknowledging a concern and responding to it makes the argument more convincing.'},
{s:'ela',k:'Words & figurative language',t:'Connotation',ty:'mc',set:'C3',q:'In paragraph 1, the author writes that some people see the changes as “a betrayal.” What does the word “betrayal” suggest about those people’s feelings?',o:['They think the change is a harmless experiment.','They feel the libraries have broken a trust.','They believe the change will save money.','They are confused about what libraries offer.'],a:1,e:'“Betrayal” means breaking a trust or loyalty. It is a strong word that shows how seriously the critics feel about the change.'},
{s:'ela',k:'Revising & editing',t:'Move to box',ty:'dnd',box:1,q:'Which sentence in the paragraph contains an error in construction?<div class="box">(1) The lighthouse keeper climbed 180 steps every evening to light the lamp. (2) The climb was exhausting, he never complained about it. (3) Ships depended on that light to avoid the rocks below. (4) When the new automatic beacon arrived, the keeper retired to a cottage on the cliff.</div>Move the answer to the box. There is only one error in construction.',items:['Sentence 1','Sentence 2','Sentence 3','Sentence 4'],sl:['Contains an error in construction'],a:[1],e:'Sentence 2 joins two complete sentences with only a comma (a comma splice). Fix it with a period, a semicolon, or a word like “but.”'},
{s:'ela',k:'Revising & editing',t:'Concise writing',ty:'mc',q:'Which revision of the sentence is the most concise without changing its meaning?<div class="box">Due to the fact that the road was closed, we had to take a different route that was longer.</div>',o:['Because the road was closed, we took a longer route.','Due to the fact the road was closed, we had to take a route that was longer.','The road was closed, and so, because of that, we took a longer route.','Since the road was closed, it was necessary for us to take a route that was longer than the other.'],a:0,e:'“Because” replaces the wordy “due to the fact that,” and “took a longer route” replaces “had to take a different route that was longer.” The other choices keep the extra words.'}];

{s:'math',k:'Statistics',t:'Drop-down',ty:'dd',q:'A coach recorded the number of goals scored by five players: <b>6, 8, 8, 10, 28</b>.',tpl:'The mean of the data is {0}. The median is {1}. The {2} is greater because of the unusually high value, 28.',dd:[['8','10','12'],['8','10','12'],['mean','median']],a:[2,0,0],e:'Mean = (6 + 8 + 8 + 10 + 28) ÷ 5 = 60 ÷ 5 = 12. The median is the middle value, 8. The extreme value 28 pulls the mean up but does not change the median much.'},
{s:'math',k:'Ratios & rates',t:'Multiple choice',ty:'mc',q:'On a map, 3/4 inch represents 12 miles. Two towns are 2 1/4 inches apart on the map. What is the actual distance between the towns?',o:['27 miles','36 miles','48 miles','54 miles'],a:1,e:'2 1/4 ÷ 3/4 = 3, so the towns are 3 groups of 12 miles apart: 3 × 12 = 36 miles.'},
{s:'math',k:'Geometry',t:'Typed answer',ty:'g',hint:'Enter only your answer.',q:'Two angles are supplementary. One measures (3x + 10)° and the other measures (2x + 20)°. What is the measure, in degrees, of the <b>larger</b> angle?',a:'100',e:'Supplementary angles add to 180: 5x + 30 = 180, so x = 30. The angles are 3(30) + 10 = 100 and 2(30) + 20 = 80. The larger angle is 100°.'},
{s:'math',k:'Geometry',t:'Select two',ty:'ms',n:2,q:'A rectangular prism measures 5 cm by 4 cm by 3 cm. Which <b>two</b> statements are true?',o:['The volume is 60 cubic centimeters.','The volume is 47 cubic centimeters.','The surface area is 94 square centimeters.','The surface area is 60 square centimeters.','The sum of all the edge lengths is 12 centimeters.'],a:[0,2],e:'Volume = 5 × 4 × 3 = 60. Surface area = 2(5·4 + 5·3 + 4·3) = 2(20 + 15 + 12) = 94. The sum of all 12 edges is 4(5 + 4 + 3) = 48, not 12.'},
{s:'math',k:'Inequalities',t:'Typed answer',ty:'g',hint:'Enter only your answer.',q:'Sam has $50. A movie ticket costs $12, and each snack costs $4. What is the <b>greatest number</b> of snacks Sam can buy and still pay for the ticket?',a:'9',e:'12 + 4s ≤ 50 gives 4s ≤ 38, so s ≤ 9.5. Sam can only buy whole snacks, so the greatest number is 9.'},

{s:'math',k:'Percents',t:'Multiple choice',ty:'mc',q:'A store buys a jacket for $40 and marks the price up by 35%. The jacket later sells for 10% off the marked-up price. What is the store’s profit on the jacket?',o:['$4.00','$8.60','$14.00','$18.60'],a:1,e:'Marked-up price: 40 × 1.35 = $54. Sale price: 54 × 0.90 = $48.60. Profit = 48.60 − 40 = $8.60.'}];

{s:'ela',k:'Words & figurative language',t:'Figurative language',ty:'mc',set:'C4',q:'What is the effect of the simile “flour drifts like early snow” in lines 3–4?',o:['It suggests that the bakery is cold and unpleasant.','It makes the flour seem soft, light, and quiet, adding to the peaceful early-morning mood.','It shows that the bakers are worried about a storm.','It explains why customers come to the bakery.'],a:1,e:'Snow falls softly and silently, so the comparison matches the calm of the early hours. The poem uses no hint of storm or unpleasantness.'},

{s:'ela',k:'Words & figurative language',t:'Meaning of a phrase',ty:'mc',set:'C4',q:'In the last stanza, the speaker says the bakers’ “work” is “undone / only by hunger.” What does this mean?',o:['The bakers have failed to finish baking.','The bread they made has been eaten by hungry customers, so the work must be done again.','The bakers are too hungry to keep working.','The bakers dislike their jobs.'],a:1,e:'The shelves are “bare,” so the bread is gone. The customers’ hunger has “undone” the work, which is why the bakers will “rise before the sun” again tomorrow.'},

SETS.C5={title:'Bees in the City',dir:'Read the passage and answer the questions. Use the highlighter or notepad as needed.',html:PP([
'Most people picture bees in meadows, but in recent years researchers have found something surprising: cities can be good places for bees. A study that counted bee species in several European cities found more variety in the urban areas than in the surrounding farmland.',
'Farmland, it turns out, is often a poor home for wild bees. Large fields planted with a single crop offer flowers for only a few weeks, and sprays used to protect crops can harm the insects. A city, by contrast, is a patchwork. Gardens, parks, balconies, and even cracks in sidewalks supply flowers from early spring until late fall.',
'Buildings help too. Most wild bee species do not live in hives. They nest alone, digging tunnels in bare soil or settling into hollow stems and holes in old wood. Cities offer plenty of such spots: sunny patches of dirt, weathered fences, even the gaps in brick walls.',
'Not every part of a city is equally welcoming, however. Researchers who compared three neighborhoods found that the number of bee species rose with the number of flowering plants and fell with the amount of pavement.'+BEETABLE,
'The lesson for city planners is encouraging. Planting flowers on rooftops and leaving small patches of soil bare may help bees thrive. A city does not need to be turned back into a meadow to be a good place for bees; it only needs to leave room for them.'])};

{s:'math',k:'Counting & probability',t:'Typed answer',ty:'g',hint:'Enter only your answer.',q:'A fair coin is flipped 3 times. What is the probability of getting <b>exactly</b> 2 heads?',a:'3/8',e:'There are 2 × 2 × 2 = 8 equally likely outcomes. Exactly 2 heads happens in HHT, HTH, and THH, which is 3 outcomes. The probability is 3/8.'},

{s:'math',k:'Fractions & decimals',t:'Typed answer',ty:'g',hint:'Enter only your answer. Use a minus sign for a negative number.',q:'At 6 a.m. the temperature was −7°F. By noon it had risen 15°F. By 6 p.m. it had fallen 11°F from the noon temperature. What was the temperature at 6 p.m., in °F?',a:'-3',e:'−7 + 15 = 8 at noon. Then 8 − 11 = −3°F.'},
{s:'math',k:'Ratios & rates',t:'Multiple choice',ty:'mc',q:'A faucet leaks 2/5 cup of water every 3/4 hour. At this rate, how many cups will leak in 3 hours?',o:['8/15 cup','1 3/5 cups','4 1/2 cups','2 2/5 cups'],a:1,e:'Rate = (2/5) ÷ (3/4) = 8/15 cup per hour. In 3 hours: 8/15 × 3 = 8/5 = 1 3/5 cups. (Equivalently, 3 hours is 4 groups of 3/4 hour, and 4 × 2/5 = 8/5.)'},
{s:'math',k:'Geometry',t:'Composite area',ty:'mc',q:'A figure is made of a 10-by-10 square with a semicircle attached to one side. The diameter of the semicircle is the side of the square (10). What is the area of the figure?',o:['100 + 12.5π','100 + 25π','100 + 50π','50 + 25π'],a:0,e:'Square: 10 × 10 = 100. The semicircle has radius 5, so its area is half of π(5²) = 25π ÷ 2 = 12.5π. Total = 100 + 12.5π.'}];

SETS.C6={title:'The Treadle',dir:'Read the passage and answer the questions. Use the highlighter or notepad as needed.',html:PP([
'In my grandmother’s apartment, the sewing machine sat beneath the window like a patient animal. It was black and gold, with a foot pedal she called the treadle, and I was forbidden to touch it. For years I assumed it was fragile.',
'The summer I turned eleven, she let me sit beside her while she hemmed a pair of curtains. I watched her feet rock the treadle and her hands guide the cloth, and the needle rose and fell so fast it blurred. “Don’t push the cloth,” she said. “Let it travel.” When I tried, my stitches wandered like a lost ant, and I pulled the thread out three times.',
'“Again,” she said each time, with no sigh and no scolding. She was not interested in whether I was good at it. She wanted to know whether I was paying attention.',
'By August, I could sew a straight seam. The curtains were already hung, so I made a pillowcase from the leftover cloth, lumpy at one corner and slightly too small. My grandmother examined it for a long time. Then she put it on her bed, where it stayed for years.',
'I understand now that the machine was never fragile. It was precious, and I had mistaken the two.'])};

{s:'ela',k:'Structure',t:'Change in understanding',ty:'mc',set:'C6',q:'How does the narrator’s understanding of the sewing machine change from paragraph 1 to paragraph 5?',o:['At first the narrator thinks it is easily damaged, but later sees that it is treasured.','At first the narrator thinks it is ugly, but later thinks it is beautiful.','At first the narrator dislikes sewing, but later enjoys it.','At first the narrator wants to sell it, but later keeps it.'],a:0,e:'Paragraph 1 says “I assumed it was fragile.” Paragraph 5 corrects this: it was “precious.” The narrator realizes that the reason for the rule was how much the machine meant, not how easily it broke.'},
{s:'ela',k:'Evidence',t:'Select two',ty:'ms',n:2,set:'C6',q:'Select the <b>two</b> details that best show the grandmother’s approach to teaching.',o:['“…the sewing machine sat beneath the window like a patient animal.”','“…with no sigh and no scolding.”','“She wanted to know whether I was paying attention.”','“It was black and gold…”','“…hemmed a pair of curtains.”'],a:[1,2],e:'B shows her calm response to mistakes, and C shows what she values. A and D describe the machine, and E describes the project.'},
{s:'ela',k:'Words & figurative language',t:'Figurative language',ty:'mc',set:'C6',q:'What is the effect of the phrase “my stitches wandered like a lost ant” in paragraph 2?',o:['It shows the narrator’s stitches were uneven and lacked direction, with a touch of humor.','It shows the narrator was afraid of insects.','It suggests the narrator did not want to learn to sew.','It proves the grandmother’s machine was broken.'],a:0,e:'A lost ant moves without direction, just like the wobbling stitches. The comparison is also lightly funny, which shows the narrator can look back on the mistakes kindly.'},
{s:'ela',k:'Structure',t:'Role of a paragraph',ty:'mc',set:'C6',q:'How does paragraph 3 help the reader understand paragraph 4?',o:['It explains why the grandmother keeps the imperfect pillowcase: she values attention more than skill.','It shows that the grandmother was angry about the mistakes.','It describes how the curtains were hung.','It proves the narrator was the best student she ever had.'],a:0,e:'In paragraph 3 the grandmother says she cares about attention, not skill. That explains why she keeps a lumpy, too-small pillowcase on her bed.'},

{s:'ela',k:'Revising & editing',t:'Combine sentences',ty:'mc',q:'Read the sentences.<div class="box">(1) The museum opened a new wing.<br>(2) The wing displays ancient pottery.</div>Which sentence combines them best?',o:['The museum opened a new wing, it displays ancient pottery.','The museum opened a new wing that displays ancient pottery.','The museum opened a new wing, the wing displays ancient pottery.','The museum opened a new wing and displays ancient pottery.'],a:1,e:'The “that” clause attaches the second idea to “wing” smoothly. The “that” version is the best. The two comma-splice versions are errors, and the “and displays” version wrongly makes the museum the one that displays the pottery.'}];

{s:'math',k:'Expressions & equations',t:'Typed answer',ty:'g',hint:'Enter only your answer.',q:'The length of a rectangle is 3 centimeters more than twice its width. The perimeter is 54 centimeters. What is the length, in centimeters?',a:'19',e:'Let the width be w, so the length is 2w + 3. Perimeter: 2(w + 2w + 3) = 54, so 3w + 3 = 27 and w = 8. The length is 2(8) + 3 = 19.'},

{s:'math',k:'Expressions & equations',t:'Move to box',ty:'dnd',q:'Complete the steps to solve the equation for <i>x</i>.<br><br>Move the correct answer to each box. Not all answers will be used.',tpl:'<div class="el">(x + 3)/4 = (x − 1)/2</div><div class="el">x + 3 = {0}</div><div class="el">x = {1}</div>',items:['2x − 1','2x − 2','2x + 2','3','5','7'],sl:['Box 1','Box 2'],a:[1,4],e:'Multiply both sides by 4: x + 3 = 2(x − 1) = 2x − 2. Subtract x and add 2: 5 = x. Check: (5 + 3)/4 = 2 and (5 − 1)/2 = 2.'},

{s:'math',k:'Statistics',t:'Typed answer',ty:'g',hint:'Enter only your answer.',q:'The mean of Jordan’s first 4 test scores is 82. What score does Jordan need on the fifth test to raise the mean of all 5 scores to 85?',a:'97',e:'For a mean of 85 over 5 tests, the total must be 425. The first four total 4 × 82 = 328. So the fifth score must be 425 − 328 = 97.'},
{s:'math',k:'Geometry',t:'Multiple choice',ty:'mc',q:'The side length of a square is increased by 20%. By what percent does the area of the square increase?',o:['20%','40%','44%','144%'],a:2,e:'If the side is s, the new side is 1.2s and the new area is 1.44s², which is 44% greater than s². (Area changes by the square of the scale factor.)'}];
SETS.C7={title:'The Ditch That Built a City',dir:'Read the passage and answer the questions. Use the highlighter or notepad as needed.',html:PP([
'In 1817, when New York began digging a canal across the state, critics called the project “Clinton’s Ditch,” after the governor who championed it. The plan was bold: a waterway 363 miles long, linking the Hudson River at Albany to Lake Erie at Buffalo, dug mostly by hand through forest and swamp. Skeptics said it would be a waste of money.',
'They were proved wrong. When the canal opened in 1825, goods that once took weeks to cross the state by wagon could travel by boat in a matter of days. Shipping a ton of freight, which had cost about one hundred dollars by road, dropped to roughly ten. Farmers in the Midwest could suddenly sell grain in New York City, and manufacturers in the East could reach new customers.',
'The canal changed the places along its route as much as it changed the cost of shipping. Towns such as Rochester and Syracuse grew from small settlements into busy cities almost overnight. Buffalo became a major port. And New York City, at the canal’s eastern end, outgrew its rivals to become the nation’s largest city and busiest harbor.',
'Yet progress had a price. Most of the digging was done by immigrant laborers, many from Ireland, who worked long days for low pay and faced disease and dangerous conditions. The canal also altered the lives of Native peoples, whose lands were crossed and settled as traffic and towns spread.',
'By the mid-1800s, railroads began to carry freight faster than boats could, and the canal’s importance faded, though parts of it are still used today. Its legacy, however, remains: a shovel-driven gamble that reshaped a state and a nation.'])};
