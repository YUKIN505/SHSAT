<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>SHSAT Simulation, Form D</title><style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#14213d;--mute:#5b6678;--line:#d5dbe6;--navy:#1d3a6e;--onnavy:#fff;--sel:#e3ecff;--ok:#1f7a4d;--bad:#b3261e;--flag:#c77700;--green:#1f7a4d;--font:"Trebuchet MS","Segoe UI",Verdana,sans-serif;--serif:Georgia,"Times New Roman",serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--card:#18233a;--ink:#e8edf7;--mute:#9aa7bd;--line:#2c3a56;--navy:#4a74c9;--sel:#223457;--ok:#4cc58a;--bad:#ff8a80;--flag:#ffb74d;--green:#2e9e6a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
.top{position:sticky;top:0;background:var(--navy);color:var(--onnavy);padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:8px;z-index:5}
.top b{flex:1;text-align:center;font-size:15px}
.ib{border:1px solid rgba(255,255,255,.5);background:transparent;color:var(--onnavy);border-radius:8px;min-width:40px;height:36px;font:inherit;font-size:18px;padding:0 8px}
.ib:disabled{opacity:.35}
.timer{font-variant-numeric:tabular-nums;font-weight:700;min-width:48px;text-align:right}
.tabs{display:flex;gap:6px;padding:10px 14px 0;max-width:980px;margin:0 auto}
.tab{flex:1;padding:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:inherit;font-size:14px}
.tab.on{background:var(--navy);color:var(--onnavy);border-color:var(--navy)}
main{max-width:980px;margin:0 auto;padding:12px 14px 100px}
.split{display:grid;gap:12px}
@media(min-width:820px){.split.two{grid-template-columns:1fr 1fr}}
.pane{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.pass{font-family:var(--serif);font-size:17px;line-height:1.65}
@media(min-width:820px){.pass{max-height:72vh;overflow:auto}}
.pass h3{font-family:var(--font);margin:0 0 8px;font-size:18px}
.dir{font-family:var(--font);font-size:13px;color:var(--mute);margin-bottom:8px}
.meta{color:var(--mute);font-size:13px;margin-bottom:6px}
.q{font-size:17px;margin:4px 0 12px}
.pp{display:flex;gap:10px;margin:0 0 10px}.pp>b{font-family:var(--font);font-size:12px;color:var(--mute);min-width:1.4em;padding-top:5px}.pp>div{flex:1}
.sn{cursor:pointer;border-radius:4px}.sn:hover{background:var(--sel)}.sn.on{background:#ffe08a;color:#14213d}.sn small{font-family:var(--font);font-size:11px;color:var(--mute);font-weight:700}
.pl{display:flex;gap:12px;line-height:1.5}.pl i{font-style:normal;width:1.6em;text-align:right;font-family:var(--font);font-size:12px;color:var(--mute);padding-top:4px}.pl span{flex:1}.stz{height:10px}
table.tb{border-collapse:collapse;width:100%;font-family:var(--font);font-size:14px;margin:6px 0}
table.tb th,table.tb td{border:1px solid var(--line);padding:6px 8px;text-align:center}table.tb th{background:var(--bg)}
.cap{font-family:var(--font);font-size:13px;font-weight:700;margin-top:8px}
.opt{display:flex;gap:8px;align-items:stretch;margin:8px 0}
.opt button.c{flex:1;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;display:flex;gap:10px}
.opt button.c.sel{background:var(--sel);border-color:var(--navy)}
.opt button.c.cut .t{text-decoration:line-through;opacity:.45}
.L{font-weight:700;min-width:1.2em}
.x{width:40px;border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:8px;font:inherit}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;z-index:4}
.btn{border:1px solid var(--navy);background:var(--card);color:var(--navy);border-radius:8px;padding:10px 14px;font:inherit;font-weight:700}
.btn.p{background:var(--navy);color:var(--onnavy)}
.btn.gr{background:var(--green);border-color:var(--green);color:#fff;font-size:18px;padding:14px 22px}
.btn.f.on{background:var(--flag);border-color:var(--flag);color:#fff}
.btn:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin:12px 0}
.gb{aspect-ratio:1;border-radius:8px;border:1.5px dashed var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;position:relative}
.gb.a{background:var(--sel);border:1.5px solid var(--navy)}
.gb.fl::after{content:"⚑";position:absolute;top:1px;right:5px;color:var(--flag);font-size:13px}
.gb:disabled{opacity:.35}
.exp{margin-top:12px;padding:10px 12px;border-left:4px solid var(--navy);background:var(--bg);border-radius:4px;font-size:15px}
h1{font-size:26px;margin:6px 0}h2{font-size:19px;margin:16px 0 6px}
.big{font-size:44px;font-weight:700;color:var(--navy)}
ul{padding-left:20px}
.item{border-top:1px solid var(--line);padding:14px 0}
.tag{font-weight:700}.ok{color:var(--ok)}.bad{color:var(--bad)}
.lv{display:block;width:100%;text-align:left;margin:10px 0;padding:14px}.lv small{font-weight:400;opacity:.85}
select.dd{font:inherit;font-size:16px;padding:4px 6px;border:1.5px solid var(--navy);border-radius:6px;background:var(--card);color:var(--ink);max-width:100%}
.eq{display:flex;align-items:center;gap:8px;border:2px solid var(--navy);border-radius:8px;padding:8px 12px;min-height:54px;font-size:24px;background:var(--card);margin:6px 0 10px;max-width:340px}
.eq .pre{color:var(--mute)}.eq .cur{display:inline-block;width:2px;height:26px;background:var(--navy);animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;font-size:20px;line-height:1.1}.fr span:first-child{border-bottom:2px solid var(--ink);padding:0 4px;min-width:1ch;text-align:center}.fr span:last-child{padding:0 4px;min-width:1ch;text-align:center}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:340px}
.kp button{padding:12px 0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:inherit;font-size:19px}
.kp button.o{background:var(--bg);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1.5px solid var(--navy);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 14px;font:inherit}
.chip.on{background:#ffe08a;color:#14213d}
.slot{display:inline-block;min-width:120px;min-height:38px;border:2px dashed var(--navy);border-radius:8px;padding:6px 10px;vertical-align:middle;background:var(--card);color:var(--ink);font:inherit;text-align:center}
.slot.fill{border-style:solid;background:var(--sel)}
.srow{display:flex;gap:10px;align-items:center;margin:8px 0}.srow>div:first-child{flex:1}
.nl{width:100%;max-width:420px;touch-action:manipulation}
.tools{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}
.tl{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 10px;font:inherit;font-size:13px}
textarea.np{width:100%;min-height:90px;font:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:8px;padding:8px;background:var(--card);color:var(--ink);margin-bottom:10px}
.ib.pri{background:#2563eb;border-color:#2563eb}
mark.hl{background:#ffe08a;color:#14213d;border-radius:2px}
.box{border:1.5px solid var(--ink);border-radius:4px;padding:10px 12px;margin:8px 0;font-family:var(--serif);font-size:16px;line-height:1.6}
.bigbox{border:2px dashed var(--navy);border-radius:10px;padding:10px;min-height:90px;text-align:center;margin:12px 0;background:var(--bg)}.bigbox .bt{font-weight:700;color:var(--mute);margin-bottom:8px}
.chip.big{padding:14px 18px;min-width:96px;border-radius:10px;font-weight:700}
.el{font-size:20px;line-height:2.3;font-family:var(--serif)}
.rep{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 14px}.rep th,.rep td{border:1px solid var(--line);padding:6px 8px;text-align:left}.rep .gh{background:#3a4f63;color:#fff;text-align:center;font-size:15px}.rep .ch{background:#4b6580;color:#fff}
.intro{text-align:center;padding:40px 10px}.intro h1{font-size:28px}.pill{display:inline-block;background:#dceaf7;color:#25506f;border:1px solid #b6d6ec;border-radius:4px;padding:16px 36px;font-size:22px;margin:14px 0 26px}
.endc{text-align:center;padding:30px 10px}
</style></head><body><div id="app"></div><script>
function PP(a){return a.map(function(t,i){return '<div class="pp"><b>'+(i+1)+'</b><div>'+t+'</div></div>'}).join('')}
function POEM(st){var n=0;return st.map(function(s){return s.map(function(l){n++;return '<div class="pl"><i>'+(n%5==0?n:'')+'</i><span>'+l+'</span></div>'}).join('')}).join('<div class="stz"></div>')}
function SENTS(paras){var n=0;return paras.map(function(p){return '<p>'+p.map(function(s){n++;return '<span class="sn" id="sn'+n+'" onclick="snp('+n+')"><small>['+n+']</small> '+s+'</span>'}).join(' ')+'</p>'}).join('')}
var SETS={};

function PIE(d){var cx=150,cy=150,r=110,a0=-Math.PI/2,cols=['#9db8ea','#f4c98b','#a8d8b9','#e8a5a5','#cbb7e6'],h='<svg viewBox="0 0 300 300" width="300" style="max-width:100%" role="img" aria-label="Pie chart of how students travel to school">';d.forEach(function(x,i){var a1=a0+x[1]/100*2*Math.PI,lg=x[1]>50?1:0,p='M'+cx+','+cy+' L'+(cx+r*Math.cos(a0))+','+(cy+r*Math.sin(a0))+' A'+r+','+r+' 0 '+lg+' 1 '+(cx+r*Math.cos(a1))+','+(cy+r*Math.sin(a1))+' Z',m=(a0+a1)/2,out=x[1]<15,lr=out?r+24:r*0.62;h+='<path d="'+p+'" fill="'+cols[i]+'" stroke="#14213d" stroke-width="1.5"/><text x="'+(cx+lr*Math.cos(m)).toFixed(1)+'" y="'+(cy+lr*Math.sin(m)).toFixed(1)+'" text-anchor="middle" font-size="12" style="fill:'+(out?'var(--ink)':'#14213d')+'">'+x[0]+' '+x[1]+'%</text>';a0=a1});return h+'</svg>'}
function TBL(top,bot,a,b){return '<table class="tb"><tr><th>'+a+'</th>'+top.map(function(x){return '<td>'+x+'</td>'}).join('')+'</tr><tr><th>'+b+'</th>'+bot.map(function(x){return '<td>'+x+'</td>'}).join('')+'</tr></table>'}
var PYR='<svg viewBox="0 0 250 190" width="250" style="max-width:100%" role="img" aria-label="Square pyramid with apex R, base MNPQ, and S the midpoint of side QP"><g fill="none" stroke="#1d3a6e" stroke-width="2" style="stroke:var(--ink)"><polyline points="125,15 30,120 125,170 215,115 125,15"/><line x1="125" y1="15" x2="125" y2="170"/><line x1="125" y1="15" x2="170" y2="142"/><g stroke-dasharray="5 4"><line x1="125" y1="15" x2="125" y2="90"/><polyline points="30,120 125,90 215,115"/></g><polyline points="160,139 164,150 175,146" stroke-width="1.5"/></g><g font-size="14" style="fill:var(--ink)"><text x="122" y="11" text-anchor="end">R</text><text x="12" y="124">M</text><text x="118" y="188">Q</text><text x="220" y="119">P</text><text x="110" y="86">N</text><text x="176" y="154">S</text></g></svg>';
var MATH=[
{s:'math',k:'Expressions & equations',t:'Move to box',ty:'dnd',reuse:1,q:'Complete the steps to show one way to solve the equation <b>30 = −1.5(x + 6)</b> for <i>x</i>.<br><br>Move the correct answer to each box. Each answer may be used more than once. Not all answers will be used.',tpl:'<div class="el">30 = −1.5(x + 6)</div><div class="el">30 = −1.5x + {0}</div><div class="el">{1} = −1.5x</div><div class="el">{2} = x</div>',items:['−45','−39','−26','−9','9','26','39','45'],sl:['Box 1','Box 2','Box 3'],a:[3,6,2],e:'Distribute: −1.5 × 6 = −9, so 30 = −1.5x + (−9). Add 9 to both sides: 39 = −1.5x. Divide both sides by −1.5: x = −26. Watch the signs: a positive 9 in the first box, or 26 in the last, usually means a sign slipped.'},
{s:'math',k:'Data displays',t:'Pie chart',ty:'mc',q:'The pie chart shows how the 800 students at Lakeview Middle School travel to school.<div style="margin:8px 0;text-align:center">'+PIE([['Bus',35],['Walk',25],['Car',20],['Bike',12],['Subway',8]])+'</div>How many more students ride the bus than ride a bike?',o:['96','144','184','280'],a:2,e:'Bus is 35% of 800 = 280 students. Bike is 12% of 800 = 96 students. The difference is 280 − 96 = 184. (Or find the difference in percent first: 35% − 12% = 23%, and 23% of 800 = 184.)'},
{s:'math',k:'Geometry',t:'Surface area',ty:'mc',q:'In the square pyramid below, all four triangular faces have the same area. The base MNPQ is a square that measures 10 centimeters on each side, and the length of <b>RS</b> is 12 centimeters. What is the surface area of the pyramid <b>excluding</b> the base?<div style="margin:8px 0;text-align:center">'+PYR+'</div>',o:['120 sq cm','240 sq cm','340 sq cm','440 sq cm'],a:1,e:'Each triangular face has base 10 and height RS = 12. Area of one face = ½ × 10 × 12 = 60. There are 4 faces: 4 × 60 = 240 square centimeters. (340 adds the base, which the question excludes.)'},
{s:'math',k:'Ratios & rates',t:'Unit relationships',ty:'mc',q:'<div style="text-align:center;line-height:1.9">1 zib = 3 mops<br>2 rels = 5 zibs<br>5 pips = 2 mops<br>3 tarks = 2 rels</div>The country of Zandria has five types of coins: mops, zibs, rels, pips, and tarks. The relationships are shown above. Which coin is worth the most?',o:['mop','zib','rel','tark'],a:2,e:'Change everything to mops. A zib is 3 mops. A rel is 5 zibs ÷ 2 = 2.5 zibs = 7.5 mops. A pip is 2 ÷ 5 = 0.4 mop. A tark is 2/3 of a rel = 5 mops. The rel (7.5 mops) is worth the most.'},
{s:'math',k:'Ratios & rates',t:'Ratio',ty:'mc',q:'A summer camp has 18 counselors. There are 117 campers in the youngest group. The camper-to-counselor ratio for the <b>whole</b> camp is 12 to 1. How many campers are <b>not</b> in the youngest group?',o:['81','99','117','216'],a:1,e:'A 12 to 1 ratio with 18 counselors means 18 × 12 = 216 campers in all. Take away the youngest group: 216 − 117 = 99.'},
{s:'math',k:'Counting & probability',t:'Plot a point',ty:'plot',q:'A bag contains 5 red marbles, 3 blue marbles, and 2 green marbles. One marble is chosen at random. Plot the probability that the marble is <b>blue</b> on the number line.',a:3,e:'There are 5 + 3 + 2 = 10 marbles and 3 are blue, so the probability is 3/10 = 0.3. Each tick on the number line is one tenth, so plot the point at 0.3.'},
{s:'math',k:'Fractions & decimals',t:'Select three',ty:'ms',n:3,q:'Which <b>three</b> fractions are equal to 0.375?',o:['3/8','7/16','6/16','9/24','12/30'],a:[0,2,3],e:'3/8 = 0.375. 6/16 and 9/24 both reduce to 3/8. But 7/16 = 0.4375 and 12/30 = 0.4.'},
{s:'math',k:'Proportional relationships',t:'Select two tables',ty:'ms',n:2,q:'Which <b>two</b> tables show a proportional relationship between hours worked and pay?',o:[TBL([2,4,6,8],[6,12,18,24],'Hours','Pay ($)'),TBL([2,4,6,8],[5,9,13,17],'Hours','Pay ($)'),TBL([2,4,6,8],[10,20,30,40],'Hours','Pay ($)'),TBL([2,4,6,8],[4,6,8,10],'Hours','Pay ($)'),TBL([2,4,6,8],[1,3,6,10],'Hours','Pay ($)')],a:[0,2],e:'In a proportional relationship, pay ÷ hours is always the same number. Table A: 6/2 = 12/4 = 3 every time. Table C: 10/2 = 20/4 = 5 every time. In the others the ratio changes (for example, 5/2 and 9/4).'},
{s:'math',k:'Inequalities',t:'Typed answer',ty:'g',hint:'Enter only your answer.',q:'How many positive integers <i>n</i> satisfy the inequality <b>3n + 7 &lt; 40</b>?',a:'10',e:'Subtract 7: 3n &lt; 33. Divide by 3: n &lt; 11. The positive integers less than 11 are 1 through 10, which is 10 numbers. (11 does not work because the inequality is strict.)'},
{s:'math',k:'Integers & negatives',t:'Typed answer',ty:'g',hint:'Enter only your answer.',q:'At noon the temperature was 5°F. It fell 3°F each hour for 4 hours, and then it rose 2°F each hour for 3 hours. What was the temperature, in °F, at the end of the 7 hours?',a:'-1',e:'The fall is 3 × 4 = 12 degrees: 5 − 12 = −7. The rise is 2 × 3 = 6 degrees: −7 + 6 = −1. Use the minus key for the negative sign.'},
{s:'math',k:'Sets & overlap',t:'Move to box',ty:'dnd',q:'In a class of 30 students, 18 students play soccer, 14 students play chess, and 5 students play both games.<br><br>Move the correct number to each box.',tpl:'<div class="el">There are {0} students who play <b>only</b> soccer, and {1} students who play <b>neither</b> game.</div>',items:['3','9','13','14','23','27'],sl:['Box 1','Box 2'],a:[2,0],e:'Only soccer: 18 − 5 = 13. Students who play at least one game: 18 + 14 − 5 = 27 (subtract the 5 who were counted twice). Neither: 30 − 27 = 3.'},
{s:'math',k:'Percents',t:'Typed answer',ty:'g',hint:'Enter your answer as a decimal.',q:'A store buys a bike for $120 and marks the price up 45%. During a sale, the store takes 20% off the marked price. What is the store’s profit, in dollars, on one bike sold during the sale?',a:'19.2',e:'Marked price: 120 × 1.45 = $174. Sale price: 174 × 0.80 = $139.20. Profit = 139.20 − 120 = $19.20, so enter 19.2 (19.20 is also accepted).'},
{s:'math',k:'Geometry',t:'Circles',ty:'mc',q:'A circular pond has a diameter of 12 meters. A circular fountain with a circumference of 6π meters sits in the pond. What is the area of the part of the pond <b>not</b> covered by the fountain?',o:['9π sq m','27π sq m','30π sq m','36π sq m'],a:1,e:'The pond has radius 6, so its area is 36π. The fountain has circumference 6π = 2πr, so r = 3 and its area is 9π. Uncovered area = 36π − 9π = 27π.'},
{s:'math',k:'Counting & probability',t:'Probability from a table',ty:'mc',q:'The table shows the favorite pet of each of 50 students.<table class="tb"><tr><th>Pet</th><th>Dog</th><th>Cat</th><th>Fish</th><th>Bird</th></tr><tr><th>Students</th><td>18</td><td>14</td><td>8</td><td>10</td></tr></table>One student is chosen at random. What is the probability that the student’s favorite pet is <b>not</b> a dog or a cat?',o:['28%','32%','36%','64%'],a:2,e:'Students who chose fish or bird: 8 + 10 = 18. The probability is 18/50 = 36/100 = 36%. (64% is the chance of a dog or a cat.)'}];

SETS.T={title:'Life in a Tide Pool',dir:'Read the passage and answer the questions. Use the highlighter or notepad as needed.',html:PP([
'Twice a day, the ocean pulls back from rocky coasts and leaves behind small pools of seawater. For a few hours, these tide pools are cut off from the sea, and the animals living in them must survive conditions that change quickly.',
'In the heat of a sunny afternoon, the water in a shallow pool can warm by ten degrees or more, and evaporation makes it saltier as well. Hermit crabs, sea stars, and anemones endure these swings, yet scientists would not call this toughness luck. Many of these animals have bodies built for the challenge. For example, an anemone can pull in its tentacles and close up like a fist, trapping a drop of water against its skin.',
'Rain creates the opposite problem. A heavy shower can dilute a pool until it is nearly fresh water, which can harm animals adapted to salt. Mussels respond by sealing their shells tightly and waiting, sometimes for hours, until the tide returns.',
'Researchers recently measured how much the water warmed at low tide in four pools of different depths. Their results appear in the table.<div class="cap">Temperature rise at low tide, by pool depth</div><table class="tb"><tr><th>Pool</th><th>Depth</th><th>Temperature rise (°F)</th></tr><tr><td>1</td><td>5 cm</td><td>14</td></tr><tr><td>2</td><td>10 cm</td><td>9</td></tr><tr><td>3</td><td>20 cm</td><td>5</td></tr><tr><td>4</td><td>40 cm</td><td>2</td></tr></table>',
'The pattern was clear: deeper pools changed less. Because they hold more water, they heat and cool more slowly, giving their residents a steadier home. Scientists hope the findings will help them predict which pools will shelter life as oceans grow warmer.'])};
SETS.F={title:'The Last Ferry',dir:'Read the passage and answer the questions. Use the highlighter or notepad as needed.',html:PP([
'Marisol had promised herself she would not cry at the dock. The ferry, white and slow, was already turning in the gray water, and her grandfather stood at the rail with his battered canvas bag, waving with his whole arm the way he always did.',
'“Write when you get there,” he had said that morning, as though the island were not just forty minutes across the bay. It was the way he said it, lightly, that she understood. For him, the crossing was an ordinary errand. For her, it was the moment the summers ended.',
'She walked along the pier until the boards ran out, hands deep in her sweatshirt pockets, and watched the ferry shrink to a small bright square. A gull landed on a post nearby and eyed her sandwich. “Don’t even think about it,” she told the gull, and was surprised to find she was smiling.',
'On the way home she took the long route past the bakery, where Mr. Okafor was sweeping the step. “Your grandfather’s gone already?” he asked. She nodded. “Then I suppose you’ll be needing someone to help with his share of the cinnamon rolls,” he said, and held the door open.'])};
var ELA=[
{s:'ela',k:'Central idea & summary',t:'Multiple choice',ty:'mc',set:'T',q:'Which statement best expresses the central idea of the passage?',o:['Tide pools form twice a day on every coast in the world.','Tide pool animals survive rapid changes through special adaptations, and deeper pools change less.','Hermit crabs are the toughest animals living in tide pools.','Oceans are warming faster than scientists predicted.'],a:1,e:'The passage covers heat, salt, and rain, how animals cope, and how depth steadies a pool. Choice B covers all of it. The others are too narrow or add ideas the passage does not state.'},
{s:'ela',k:'Words & figurative language',t:'Effect of a phrase',ty:'mc',set:'T',q:'Read these sentences from paragraph 2.<div style="margin:8px 0 8px 18px"><b>Hermit crabs, sea stars, and anemones endure these swings, yet scientists would not call this toughness luck. Many of these animals have bodies built for the challenge.</b></div>Which statement describes the effect of the phrase “built for the challenge”?',o:['It implies that the animals survive mostly by chance.','It suggests that the animals’ physical features are well suited to the conditions.','It shows that the challenge is easy for every animal.','It emphasizes that scientists designed the animals.'],a:1,e:'“Built for” treats the animals’ bodies as if they were made to handle the problem, and the sentence before it rules out luck. The phrase points to adaptations.'},
{s:'ela',k:'Evidence',t:'Select two',ty:'ms',n:2,set:'T',q:'Select the <b>two</b> sentences that best support the idea that tide pool animals have ways of coping with harsh conditions.',o:['“For example, an anemone can pull in its tentacles and close up like a fist, trapping a drop of water against its skin.”','“Rain creates the opposite problem.”','“Mussels respond by sealing their shells tightly and waiting, sometimes for hours, until the tide returns.”','“Twice a day, the ocean pulls back from rocky coasts and leaves behind small pools of seawater.”','“A heavy shower can dilute a pool until it is nearly fresh water, which can harm animals adapted to salt.”'],a:[0,2],e:'A and C each describe something an animal does to survive. B, D, and E describe the conditions or the problem, not a way of coping.'},
{s:'ela',k:'Reading data',t:'Multiple choice',ty:'mc',set:'T',q:'Which conclusion is best supported by the table in paragraph 4?',o:['Shallow pools lose water faster than deep pools.','The deeper the pool, the smaller the temperature rise.','Pools deeper than 20 cm never change temperature.','Small pools contain more animals than large pools.'],a:1,e:'The temperature rise falls from 14°F to 9°F to 5°F to 2°F as depth grows. Choice C is too strong, since the 20 cm pool still warmed by 5°F.'},
{s:'ela',k:'Structure',t:'Multiple choice',ty:'mc',set:'T',q:'How does paragraph 3 relate to paragraph 2?',o:['It describes a different kind of problem, caused by rain instead of heat.','It repeats the same example with different animals.','It introduces the study that is described next.','It states the conclusion of the passage.'],a:0,e:'Paragraph 2 is about heat and salt. Paragraph 3 begins “Rain creates the opposite problem,” so it shows a contrasting challenge.'},
{s:'ela',k:'Characters & point of view',t:'Multiple choice',ty:'mc',set:'F',q:'Which detail from paragraph 1 best shows that Marisol is trying to hide her sadness?',o:['The ferry was white and slow.','She had promised herself she would not cry.','Her grandfather carried a canvas bag.','The water was gray.'],a:1,e:'The promise not to cry shows she is sad and trying to hold it in. The other details describe the scene, not her effort to hide a feeling.'},
{s:'ela',k:'Characters & point of view',t:'Multiple choice',ty:'mc',set:'F',q:'How does paragraph 3 change the mood of the passage?',o:['It adds danger and makes the mood tense.','It adds humor that begins to lift Marisol’s sadness.','It shows that Marisol is angry at her grandfather.','It explains why the ferry was late.'],a:1,e:'Marisol jokes with the gull and finds herself smiling. That small humorous moment starts to lighten the mood.'},
{s:'ela',k:'Characters & point of view',t:'Move to box',ty:'dnd',set:'F',q:'Match each detail from the passage to what it reveals.<br><br>Move the correct answer to each box.',items:['He offers kindness without making a fuss.','He is warm and openly affectionate.','The trip seems routine to him but is a big change for her.'],sl:['“waving with his whole arm the way he always did”','“For him, the crossing was an ordinary errand.”','“held the door open”'],a:[1,2,0],e:'Waving “with his whole arm” shows an affectionate grandfather. An “ordinary errand” for him versus the end of the summers for her shows the difference in how they feel. Mr. Okafor holds the door and offers cinnamon rolls: a quiet kindness.'},
{s:'ela',k:'Central idea & summary',t:'Multiple choice',ty:'mc',set:'F',q:'Which statement best expresses a theme of the passage?',o:['Saying goodbye is easier if you pretend it does not matter.','Small kindnesses can ease the sadness of a goodbye.','Children should never feel sad when family leaves.','Bad weather makes travel difficult.'],a:1,e:'The gull’s joke and Mr. Okafor’s offer both lighten Marisol’s mood. The theme is that small kindnesses and humor help us through sad moments.'},
{s:'ela',k:'Sentence structure',t:'Move to box',ty:'dnd',box:1,q:'Which sentence in the paragraph contains an error in construction?<div class="box">(1) The red panda, a small mammal that lives in the mountain forests of Asia, spends most of its day sleeping in trees. (2) Because its diet consists mostly of bamboo leaves, which provide little energy, it moves slowly and rests often. (3) Red pandas are not closely related to giant pandas, even though both animals eat bamboo and has thick fur. (4) Their bushy tails help them keep warm in the cold.</div>Move the answer to the box. There is only one error in construction.',items:['Sentence 1','Sentence 2','Sentence 3','Sentence 4'],sl:['Contains an error in construction'],a:[2],e:'In sentence 3, “both animals eat bamboo and has thick fur” mixes a plural verb (eat) with a singular one (has). Both verbs need the same form: “eat bamboo and have thick fur.”'},
{s:'ela',k:'Revising & editing',t:'Combine sentences',ty:'mc',q:'Read these sentences.<div class="box">(1) Solar panels convert sunlight into electricity.<br>(2) Solar panels do not produce power at night.</div>What is the best way to combine the sentences to clarify the relationship between the ideas?',o:['Because solar panels convert sunlight into electricity, they do not produce power at night.','Solar panels convert sunlight into electricity, however they do not produce power at night.','Solar panels convert sunlight into electricity, so they do not produce power at night.','Although solar panels convert sunlight into electricity, they do not produce power at night.'],a:3,e:'The two ideas contrast: panels work, but not at night. “Although” shows that contrast. A and C wrongly make one idea the cause of the other. B is a comma splice (“however” needs a semicolon before it).'},
{s:'ela',k:'Revising & editing',t:'Revise a paragraph',ty:'mc',q:'How should the paragraph be revised?<div class="box">(1) Last spring, our class plant a garden behind the school. (2) We spent several afternoons turning the soil, and then we planted tomatoes, peppers, and herbs. (3) By June, the plants had grown taller then any of us expected.</div>',o:['Sentence 1: Change <i>plant</i> to <i>planted</i>, AND Sentence 3: Change <i>then</i> to <i>than</i>.','Sentence 1: Change <i>plant</i> to <i>plants</i>, AND Sentence 3: Change <i>then</i> to <i>than</i>.','Sentence 2: Delete the comma after <i>soil</i>, AND Sentence 3: Change <i>taller</i> to <i>tallest</i>.','Sentence 1: Change <i>plant</i> to <i>planted</i>, AND Sentence 2: Insert a comma after <i>planted</i>.'],a:0,e:'“Last spring” signals the past, so “plant” should be “planted.” In a comparison, the word is “than,” not “then.” Sentence 2 is already correct.'},
{s:'ela',k:'Sentence structure',t:'Find the error',ty:'mc',q:'Which part of the paragraph contains an error in sentence structure?<div class="box">The harbor festival begins each summer with a parade <u>that features local bands</u>. <u>Which are joined by dancers from nearby schools.</u> <u>Afterward, crowds gather along the pier to watch fireworks.</u></div>',o:['that features local bands','Which are joined by dancers from nearby schools.','Afterward, crowds gather along the pier to watch fireworks.','None of these parts contains an error.'],a:1,e:'“Which are joined by dancers from nearby schools.” starts with “Which” and has no complete idea of its own, so it is a sentence fragment. It should be attached to the previous sentence.'},
{s:'ela',k:'Revising & editing',t:'Concise revision',ty:'mc',q:'Which revision is the most concise while keeping the meaning?<br><br><i>The team practices at the field that is located near the school each and every day on a daily basis.</i>',o:['The team practices daily at the field near the school.','The team practices at the field located near the school, and it practices daily each day.','Each day, the team practices on a daily basis at the field near the school.','The team daily practices at the field that is near the school every day.'],a:0,e:'“Each and every day” and “on a daily basis” both repeat the idea “daily.” Keep it once, and shorten “that is located near” to “near.”'},
{s:'ela',k:'Revising & editing',t:'Move to box',ty:'dnd',q:'Move the correct punctuation mark to the box to complete the sentence.',tpl:'<div class="el">The storm knocked out power for two days{0} however, the shelter stayed warm.</div>',items:[',',';',':','—'],sl:['Box'],a:[1],e:'“However” joins two complete sentences here, so a semicolon goes before it and a comma goes after it. A comma alone would be a comma splice.'}];

{k:'Counting & probability',t:'Typed answer',ty:'g',hint:'Enter only your answer.',q:'A student picks one of 4 shirts and one of 3 pairs of pants. How many different outfits are possible?',a:'12',e:'Multiply the choices: 4 × 3 = 12.'},
{k:'Statistics',t:'Multiple choice',ty:'mc',q:'The mean of 5 test scores is 82. Four of the scores are 78, 85, 90, and 80. What is the fifth score?',o:['75','77','79','82'],a:1,e:'Total = 5 × 82 = 410. The four known scores total 333, so the fifth is 77.'},
{k:'Geometry',t:'Multiple choice',ty:'mc',q:'A triangle has a base of 10 and a height of 7. What is its area?',o:['17','35','70','140'],a:1,e:'Area = ½ × 10 × 7 = 35.'},
{k:'Geometry',t:'Typed answer',ty:'g',hint:'Enter only your answer.',q:'A rectangle has a length of 9 and a width of 4. What is its perimeter?',a:'26',e:'Perimeter = 2 × (9 + 4) = 26. (36 would be the area.)'},
{k:'Revising & editing',t:'Multiple choice',ty:'mc',q:'Which revision corrects the error?<br><br><i>Each of the students have a locker.</i>',o:['Each of the students has a locker.','Each of the student have a locker.','Each of the students, have a locker.','No revision is needed.'],a:0,e:'“Each” is singular, so it takes “has.” Ignore the words “of the students” when picking the verb.'},
{k:'Revising & editing',t:'Multiple choice',ty:'mc',q:'Which transition best completes the sentence?<br><br><i>The bridge was closed for repairs. ______, commuters had to take a longer route.</i>',o:['For example','Nevertheless','As a result','Meanwhile'],a:2,e:'The longer route is a consequence of the closure, so “As a result” shows cause and effect.'},
{k:'Reading data',t:'Multiple choice',ty:'mc',q:'<i>A chart shows that a library’s visitors grew from 200 a week in January to 520 a week in June.</i><br><br>What does the chart add to a sentence saying “More people visit the library in summer”?',o:['Exact numbers showing how much visits grew','The reason people like reading','A list of books people borrowed','The library’s opening hours'],a:0,e:'A chart gives specific numbers. They show how big the increase is, not just that there is one.'},

{k:'Evidence',t:'Multiple choice',ty:'mc',q:'<i>Mr. Lee’s garden was famous. Neighbors stopped to admire the tomatoes, and children asked if they could pick one.</i><br><br>Which detail best supports the idea that the garden was admired?',o:['Mr. Lee’s garden was famous.','Neighbors stopped to admire the tomatoes.','Mr. Lee grew tomatoes.','Children asked if they could pick one.'],a:1,e:'Choose the detail that shows people admiring the garden. “Stopped to admire” is the most direct evidence.'},
{k:'Central idea & summary',t:'Multiple choice',ty:'mc',q:'<i>Priya tapped the ice twice with her boot before stepping out. Her brother, already halfway across, laughed at her caution.</i><br><br>Which statement best describes Priya?',o:['She is careful.','She is lazy.','She is jealous.','She dislikes winter.'],a:0,e:'Testing the ice twice shows she is careful. Her brother’s laughter points out how cautious she is.'},
{k:'Words & figurative language',t:'Multiple choice',ty:'mc',q:'<i>The speech was only two minutes long, yet when Ms. Alvarez finished, no one moved.</i><br><br>What does “no one moved” suggest?',o:['The audience was bored.','The audience was deeply affected.','The room was too small.','The speech was unclear.'],a:1,e:'People stay still when they are moved by something. The stillness shows the speech had a strong effect.'}];
var TIPS={'Ratios & rates':'Find the rate for one unit (one inch, one gallon, one hour) first, then scale up. For work problems, add the fractions of the job done per hour.','Percents':'Percents of percents multiply, they do not add. Take each discount from the new price, one step at a time.','Expressions & equations':'Do the same step to both sides. Distribute first, then combine like terms. Check by plugging your answer back in.','Inequalities':'Solve like an equation, but flip the sign whenever you multiply or divide by a negative. An open circle means the number is not included.','Fractions & decimals':'Convert everything to the same form (all decimals or all fractions) before comparing or combining.','Counting & probability':'Multiply the number of choices for each step. If something is not allowed, subtract those combinations at the end.','Statistics':'For a mean from a table, multiply each value by its frequency, add, and divide by the total count.','Geometry':'Sketch it and label every length. Break odd shapes into rectangles and triangles, or subtract the piece that is missing.','Revising & editing':'Ask what each sentence is doing in its paragraph. Check subject-verb agreement, then pronouns, then transitions that show the right relationship.','Reading data':'Ask: what does the table or chart show that the words alone do not? Usually the answer is exact numbers or a comparison.','Structure':'Describe the job of the paragraph or stanza in one phrase (problem, cause, solution, example, result), then pick the choice that matches.','Evidence':'First say the claim in your own words. Then choose the sentence that most directly shows it, not one that only mentions the same topic.','Central idea & summary':'The central idea covers the whole text, not one detail. Cross out choices that are too narrow or that add ideas the text does not say.','Words & figurative language':'Replace the phrase with a plain meaning and ask how it changes the feeling. Use the lines before and after as clues.'};

{k:'Sentence structure',t:'Multiple choice',ty:'mc',q:'Which revision corrects the run-on sentence?<br><br><i>The bus was late we waited in the cold.</i>',o:['The bus was late, we waited in the cold.','The bus was late; we waited in the cold.','The bus was late we, waited in the cold.','No revision is needed.'],a:1,e:'Two complete sentences need a period, a semicolon, or a comma plus a joining word. A comma alone is a comma splice.'});
TIPS['Integers & negatives']='Use a number line. Moving left subtracts and moving right adds. Do the multiplication first, then add or subtract.';
TIPS['Proportional relationships']='Divide each output by its input. If you always get the same number, the relationship is proportional. A graph or equation must pass through zero.';
TIPS['Data displays']='Turn the percent into a number of people first (percent × total), then compare. Or subtract the percents and then take the percent of the total.';
TIPS['Sets & overlap']='Add the groups, then subtract the overlap once. Subtract that total from everyone to find “neither.”';
TIPS['Characters & point of view']='Ask what the character does, says, and notices. Actions often show feelings the narrator does not state.';
TIPS['Sentence structure']='Check that each sentence has a subject and a verb, and that joined ideas use a semicolon or a joining word, not just a comma.';

function fmt(s){s=Math.max(0,s);return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}

function num(s){s=String(s==null?'':s).replace(/−/g,'-').replace(/[$,%\s]+$/,'').replace(/^\s+/,'');var m;
 if(m=/^(-?)(\d+) +(\d+)\/(\d+)$/.exec(s))return (m[1]?-1:1)*(+m[2]+m[3]/m[4]);
 if(m=/^(-?\d+)\/(\d+)$/.exec(s))return m[2]==0?NaN:m[1]/m[2];
 if(/^-?(\d+\.?\d*|\.\d+)$/.test(s))return parseFloat(s);return NaN}
function isAns(i){var q=Q[i],a=ans[i];if(a==null)return false;
 switch(q.ty){case'ms':return a.length==q.n;case'g':return String(a).trim()!=='';
 case'dd':return a.length==q.dd.length&&a.every(function(v){return v!=null&&v!==''});
 case'dnd':return a.length==q.sl.length&&a.every(function(v){return v!=null});
 case'ineq':return a.x!=null&&!!a.c&&!!a.d;default:return true}}
function eq(a,b){return a.length==b.length&&a.every(function(v,i){return v===b[i]})}
function ok(i){var q=Q[i],a=ans[i];if(!isAns(i))return false;
 switch(q.ty){case'ms':return a.slice().sort().join()==q.a.join();
 case'g':var x=num(a),y=num(q.a);return !isNaN(x)&&Math.abs(x-y)<1e-9;
 case'dd':case'dnd':return eq(a,q.a);
 case'ineq':return a.x===q.a.x&&a.c===q.a.c&&a.d===q.a.d;
 default:return a===q.a}}
function ineqT(a){return (a.c=='o'?'open':'closed')+' circle at '+a.x+', ray to the '+(a.d=='L'?'left':'right')}

 case'g':return String(a);case'dd':return a.map(function(v,j){return q.dd[j][v]}).join('; ');

 case'ineq':return ineqT(a);case'plot':return (a/10).toFixed(1);case'sn':return 'Sentence '+a}}

 ks.forEach(function(k){BANK.filter(function(b){return b.k==k}).slice(0,2).forEach(function(b){if(qs.length<8)qs.push(b)})});
